
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE BEACH</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: #b8ecfa;
    margin: 0;
}

h1 {
    color: #087b55;
    margin: 12px;
}

#info {
    font-size: 20px;
    font-weight: bold;
    margin: 12px;
}

#game {
    width: 95vw;
    max-width: 800px;
    height: 55vh;
    min-height: 350px;
    max-height: 500px;
    margin: auto;
    position: relative;
    overflow: hidden;
    border: 4px solid white;
    border-radius: 15px;
    background: linear-gradient(
        to bottom,
        #4fc8ee 0%,
        #4fc8ee 20%,
        #f4d99b 20%,
        #f4d99b 100%
    );
}

#turtle {
    position: absolute;
    font-size: 55px;
    width: 65px;
    height: 65px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
}

.trash {
    position: absolute;
    font-size: 27px;
}

#controls {
    margin: 15px auto;
    display: grid;
    grid-template-columns: 65px 65px 65px;
    grid-template-rows: 55px 55px;
    gap: 5px;
    justify-content: center;
}

.move {
    background: #087b55;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 28px;
    touch-action: none;
}

.move:active {
    background: #36a879;
}

#start {
    padding: 12px 30px;
    background: #087b55;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 20px;
}

#message {
    font-weight: bold;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>🐢 SAVE BEACH 🌊</h1>

<div id="info">
คะแนน: <span id="score">0</span>
| เวลา: <span id="time">60</span>
</div>

<div id="game">
    <div id="turtle">🐢</div>
</div>

<div id="controls">
    <div></div>
    <button class="move" data-dir="up">⬆️</button>
    <div></div>

    <button class="move" data-dir="left">⬅️</button>
    <button class="move" data-dir="down">⬇️</button>
    <button class="move" data-dir="right">➡️</button>
</div>

<button id="start" onclick="startGame()">เริ่มเกม</button>

<p id="message">ช่วยเต่าเก็บขยะให้ชายหาดสะอาด!</p>

<script>
const game = document.getElementById("game");
const turtle = document.getElementById("turtle");

let x, y, score, time;
let running = false;
let trash = [];
let timer;
let moveInterval = null;
let direction = null;

const size = 65;

function createTrash() {
    let item = document.createElement("div");
    item.className = "trash";

    let red = Math.random() < 0.2;

    item.textContent = red ? "🔴" : "🗑️";
    item.dataset.type = red ? "red" : "normal";

    item.style.left = Math.random() *
        (game.clientWidth - 35) + "px";

    item.style.top = (100 + Math.random() *
        (game.clientHeight - 140)) + "px";

    game.appendChild(item);
    trash.push(item);
}

function startGame() {
    clearInterval(timer);
    clearInterval(moveInterval);

    trash.forEach(t => t.remove());
    trash = [];

    score = 0;
    time = 60;
    x = 100;
    y = 180;
    running = true;

    turtle.style.left = x + "px";
    turtle.style.top = y + "px";

    document.getElementById("score").textContent = score;
    document.getElementById("time").textContent = time;
    document.getElementById("message").textContent =
        "แตะปุ่มลูกศรเพื่อบังคับเต่า!";

    for (let i = 0; i < 15; i++) {
        createTrash();
    }

    timer = setInterval(() => {
        time--;
        document.getElementById("time").textContent = time;

        if (time <= 0) {
            running = false;
            clearInterval(timer);
            clearInterval(moveInterval);
            document.getElementById("message").textContent =
                "🎉 หมดเวลา! คะแนนของคุณคือ " + score;
        }
    }, 1000);
}

function moveTurtle() {
    if (!running || !direction) return;

    if (direction === "up") y -= 5;
    if (direction === "down") y += 5;
    if (direction === "left") x -= 5;
    if (direction === "right") x += 5;

    x = Math.max(0, Math.min(game.clientWidth - size, x));
    y = Math.max(70, Math.min(game.clientHeight - size, y));

    turtle.style.left = x + "px";
    turtle.style.top = y + "px";

    collectTrash();
}

function collectTrash() {
    let t = turtle.getBoundingClientRect();

    for (let i = trash.length - 1; i >= 0; i--) {
        let item = trash[i];
        let r = item.getBoundingClientRect();

        if (
            t.left < r.right &&
            t.right > r.left &&
            t.top < r.bottom &&
            t.bottom > r.top
        ) {
            score += item.dataset.type === "red" ? -1 : 1;

            document.getElementById("score").textContent = score;

            item.remove();
            trash.splice(i, 1);
            createTrash();
        }
    }
}

document.querySelectorAll(".move").forEach(button => {

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        if (!running) return;

        direction = button.dataset.dir;
        clearInterval(moveInterval);

        moveTurtle();
        moveInterval = setInterval(moveTurtle, 30);
    });

    function stopMove() {
        direction = null;
        clearInterval(moveInterval);
    }

    button.addEventListener("pointerup", stopMove);
    button.addEventListener("pointerleave", stopMove);
    button.addEventListener("pointercancel", stopMove);
});
</script>

</body>
</html>
